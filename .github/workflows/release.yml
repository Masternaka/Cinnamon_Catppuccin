name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag correspondant à metadata.json (exemple : v1)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Vérifier et préparer la release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vérifications statiques
        run: bash scripts/check.sh

      - name: Valider la version et créer le ZIP
        run: python3 scripts/package-release.py "$RELEASE_TAG" --output-dir dist

      - name: Vérifier le commit d'un tag existant
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "Le tag existe sur un autre commit. Il ne sera pas déplacé."
              exit 1
            }
          fi

      - name: Créer la release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          options=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            options+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" "dist/CinnaFlow-${RELEASE_TAG}.zip" \
            --target "$GITHUB_SHA" "${options[@]}" \
            --draft --generate-notes --title "CinnaFlow ${RELEASE_TAG}"
