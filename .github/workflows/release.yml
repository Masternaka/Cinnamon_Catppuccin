name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (exemple : v0.1.0) ; il doit exister sur le commit courant'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Vérifier et préparer la release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vérifications statiques
        # Reconstruit les thèmes dans un répertoire temporaire et vérifie que
        # dist/ et previews/ suivis correspondent bien aux gabarits.
        run: bash scripts/check.sh

      - name: Vérifier le tag et le commit
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")" || {
            echo "Le tag ${RELEASE_TAG} n'existe pas sur ce commit ; le créer d'abord." >&2
            exit 1
          }
          if [ "$tag_commit" != "${GITHUB_SHA}" ]; then
            echo "Le tag ${RELEASE_TAG} pointe sur ${tag_commit}, pas sur ${GITHUB_SHA}. Il ne sera pas déplacé." >&2
            exit 1
          fi

      - name: Vérifier les archives à publier
        run: |
          set -euo pipefail
          expected=(
            dist/Catppuccin-Latte.zip
            dist/Catppuccin-Frappe.zip
            dist/Catppuccin-Macchiato.zip
            dist/Catppuccin-Mocha.zip
            dist/Catppuccin-Cinnamon-all-flavors.zip
          )
          for archive in "${expected[@]}"; do
            test -f "$archive" || { echo "Archive manquante : $archive" >&2; exit 1; }
            unzip -tq "$archive" > /dev/null
          done

      - name: Créer la release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          options=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            options+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" \
            dist/Catppuccin-Latte.zip \
            dist/Catppuccin-Frappe.zip \
            dist/Catppuccin-Macchiato.zip \
            dist/Catppuccin-Mocha.zip \
            dist/Catppuccin-Cinnamon-all-flavors.zip \
            --target "$GITHUB_SHA" "${options[@]}" \
            --draft --generate-notes \
            --title "Catppuccin pour Cinnamon ${RELEASE_TAG}"
