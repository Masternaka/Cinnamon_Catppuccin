name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Vérifications statiques
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vérifications
        run: bash scripts/check.sh

      - name: Compilation avec un autre accent
        # Un accent différent du défaut doit produire un CSS sans jeton non
        # résolu ; c'est le cas le plus probable d'oubli dans le gabarit.
        run: python3 scripts/build.py --accent mauve --no-zip
